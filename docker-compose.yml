services:

  redis:
    # Uses the image already on this machine (Redis 8.6.1) - no download.
    # (Pin a version tag like redis:8-alpine later for stricter parity.)
    image: redis:latest
    container_name: nexa-mall-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command:
      - redis-server
      - --appendonly
      - "yes"

  postgres:
    image: postgres:16-alpine
    container_name: nexa-mall-postgres
    restart: unless-stopped
    ports:
      # Host port 5433: a native Windows PostgreSQL already owns 5432,
      # so the container publishes on 5433 to avoid clashing with it.
      - "5433:5432"
    environment:
      POSTGRES_USER: nexa
      POSTGRES_PASSWORD: nexa
      POSTGRES_DB: nexa_mall
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexa -d nexa_mall"]
      interval: 5s
      timeout: 5s
      retries: 10


volumes:
  redis_data:
  postgres_data:
